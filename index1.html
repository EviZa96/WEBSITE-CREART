<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Product List with Filter</title>
</head>
<body>
  <div class="container mt-4">
    <!-- Filter Navigation -->
    <ul class="nav nav-pills mb-3 justify-content-center" id="filter-nav" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-filter="all">All</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-filter="electronics">Electronics</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-filter="fashion">Fashion</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-filter="home">Home</button>
      </li>
    </ul>

    <!-- Product List -->
    <div class="row g-3">
      <div class="col-12 col-sm-6 col-lg-4 product-item" data-category="electronics">
        <div class="card">
          <div class="card-body text-center">
            <h5 class="card-title">Product 1 (Electronics)</h5>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 product-item" data-category="fashion">
        <div class="card">
          <div class="card-body text-center">
            <h5 class="card-title">Product 2 (Fashion)</h5>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 product-item" data-category="home">
        <div class="card">
          <div class="card-body text-center">
            <h5 class="card-title">Product 3 (Home)</h5>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 product-item" data-category="electronics">
        <div class="card">
          <div class="card-body text-center">
            <h5 class="card-title">Product 4 (Electronics)</h5>
          </div>
        </div>
      </div>
      <!-- Add more products as needed -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Filter Functionality
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', function () {
        const filter = this.getAttribute('data-bs-filter');
        
        // Activate the clicked filter
        document.querySelectorAll('.nav-link').forEach(nav => nav.classList.remove('active'));
        this.classList.add('active');

        // Show/hide products
        document.querySelectorAll('.product-item').forEach(item => {
          const category = item.getAttribute('data-category');
          if (filter === 'all' || category === filter) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
